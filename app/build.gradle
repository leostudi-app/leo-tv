plugins {
    id 'com.android.application'
}

android {
    namespace 'app.leostudi.leotv'
    compileSdk 34

    defaultConfig {
        applicationId 'app.leostudi.leotv'
        minSdk 22          // Fire OS 5 and newer
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // One fixed key so new builds install over old ones without uninstalling.
    // Personal sideload key only; switch to a secret-held release key before any store submission.
    signingConfigs {
        leo {
            storeFile file('leo-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.leo }
        release {
            signingConfig signingConfigs.leo
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
