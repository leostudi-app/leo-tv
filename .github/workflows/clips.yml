name: Fetch funny clips

# Downloads the free Pexels videos listed in clips/list.json (Pexels licence: free to use in apps, no attribution needed),
# trims each to 20 seconds at 720p without sound (the app plays its own music), and saves preview frames for checking.
on:
  push:
    branches: [web]
    paths: ['clips/list.json', '.github/workflows/clips.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and trim
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg jq >/dev/null
          mkdir -p clips/preview
          for id in $(jq -r '.[].id' clips/list.json); do
            [ -f "clips/$id.mp4" ] && continue
            curl -sSfL -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36" -o /tmp/raw.mp4 "https://www.pexels.com/download/video/$id/" || { echo "FAILED download $id"; continue; }
            ffmpeg -loglevel error -y -i /tmp/raw.mp4 -t 20 -an -vf "scale=-2:'min(720,ih)'" -c:v libx264 -preset veryfast -crf 28 -movflags +faststart "clips/$id.mp4" || { echo "FAILED encode $id"; continue; }
            for t in 1 7 14; do ffmpeg -loglevel error -y -ss $t -i "clips/$id.mp4" -frames:v 1 -vf scale=320:-2 "clips/preview/$id-$t.jpg" || true; done
            echo "ok $id $(du -k clips/$id.mp4 | cut -f1)KB $(ffprobe -v error -show_entries format=duration -of csv=p=0 clips/$id.mp4)s"
          done 2>&1 | tee clips/fetch-log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "leo-clips"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clips
          git commit -m "Fetch funny clips" || echo "nothing to commit"
          git push
