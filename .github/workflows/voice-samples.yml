name: LEO voice samples
on:
  push:
    branches: [web]
    paths: ['voice/samples.py', '.github/workflows/voice-samples.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Record samples
        run: |
          {
            pip install --quiet piper-tts==1.2.0
            sudo apt-get install -y -qq ffmpeg >/dev/null
            mkdir -p /tmp/m && cd /tmp/m
            for v in en_GB/jenny_dioco/medium en_GB/alba/medium en_GB/cori/high en_GB/semaine/medium en_GB/northern_english_male/medium en_US/lessac/high en_US/amy/medium en_US/hfc_female/medium; do
              n="$(echo $v | cut -d/ -f1)-$(echo $v | cut -d/ -f2)-$(echo $v | cut -d/ -f3)"
              for ext in onnx onnx.json; do curl -sSfL -o "$n.$ext" "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/$v/$n.$ext" || echo "missing $n.$ext"; done
            done
            cd "$GITHUB_WORKSPACE"
            python voice/samples.py $(ls /tmp/m/*.onnx)
          } 2>&1 | tee voice/samples-log.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "leo-voice"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice; git commit -m "Voice samples" || true; git push
