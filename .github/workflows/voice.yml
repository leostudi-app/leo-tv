name: Record LEO's voice

# Records one clip per sentence LEO can say (voice/phrases.js) with the Piper neural voice,
# so devices without a usable speech engine (Fire TV) still hear LEO.
on:
  push:
    branches: [web]
    paths: ['voice/phrases.js', 'core.js', '.github/workflows/voice.yml', 'voice/record.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - name: Record clips
        run: |
          set -o pipefail
          {
            node voice/phrases.js > voice/phrases.json
            pip install --quiet piper-tts==1.2.0
            sudo apt-get install -y -qq ffmpeg >/dev/null
            mkdir -p /tmp/voice && cd /tmp/voice
            # LEO's voice: Poppy (Piper 'semaine' British voice, speaker poppy) - chosen by Leo's dad.
            for f in en_GB-semaine-medium.onnx en_GB-semaine-medium.onnx.json; do
              curl -sSfL -o "$f" "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_GB/semaine/medium/$f"
            done
            cd "$GITHUB_WORKSPACE"
            python voice/record.py /tmp/voice/en_GB-semaine-medium.onnx poppy
          } 2>&1 | tee voice/record-log.txt
      - name: Commit clips
        if: always()
        run: |
          git config user.name "leo-voice"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add voice
          git commit -m "Record LEO's voice clips" || echo "nothing to commit"
          git push
